/*
 * Linkage configuration.
 */

/* region (origin, length) */
/* Map physical flash 0x10000 at this virtual address. */
ROM (0x42000000, 16M)
/* Reclaim boot/ROM SRAM after _start installs the application stack.
 * No ROM services may be called after this handoff. */
RAM (0x40800000, 384K)

/* section (region[, lma_region]) */
text   (ROM)
rodata (ROM)
data   (RAM, ROM)
bss    (RAM)
