/*
 * Linkage configuration.
 */

/* region (origin, length) */
/* Map physical flash 0x10000 at this virtual address. */
ROM (0x42000000, 1M)
/* Upper SRAM is reserved for early boot and ROM data/stack. */
/* RAM may be extended to 384K after boot/ROM memory reclamation is handled. */
RAM (0x40800000, 256K)
region (BOOT, 0x40840000, 36K)

/* section (region[, lma_region]) */
text   (ROM)
rodata (ROM)
data   (RAM, ROM)
bss    (RAM)

section (esp32c5_boot, BOOT, BOOT)
phdr (esp32c5_boot, PT_LOAD, FLAGS(5))
