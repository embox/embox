TARGET = embox

ARCH = riscv

PLATFORM = esp32c5

CROSS_COMPILE = riscv64-unknown-elf-

CFLAGS += -g -O0
CFLAGS += -march=rv32imc_zicsr_zifencei -mabi=ilp32

LDFLAGS += -melf32lriscv
# Only the final executable has an entry point; module links use ld -r.
LDFLAGS += $(if $(filter mk/image3.mk,$(MAKEFILE_LIST)),-e esp32c5_boot_entry)
