package genconfig

configuration conf {
	include embox.arch.system(core_freq=816000000)
	include embox.arch.aarch64.cpu_idle
	include embox.arch.aarch64.locore
	include embox.arch.aarch64.interrupt
	include embox.arch.aarch64.context
	include embox.arch.aarch64.mem_barriers
	include embox.arch.aarch64.libarch
	include embox.arch.aarch64.vfork

	include embox.kernel.cpu.bkl
	include embox.kernel.cpu.cpudata
	include embox.kernel.irq

	@Runlevel(0) include embox.arch.aarch64.mmu(granule=64)
	/* Default 4096 tables x 64K = 256M of static page-table pool; 64 tables
	 * (4M) is plenty for a 256M RAM region plus device mappings. */
	include embox.mem.vmem_alloc_single_pool(mmu_tables_max=64)
	@Runlevel(0) include embox.kernel.task.kernel_task
	@Runlevel(0) include embox.kernel.stack(stack_size=0x200000)

	/* GIC-600 (GICv3): distributor 0xFD400000, redistributor 0xFD460000
	 * (core0 frame; 0x20000 per-core stride) */
	include embox.driver.interrupt.gicv3(gicd_base=0xFD400000, gicr_base=0xFD460000)

	/* ITS frame of the same GIC-600, message interrupts (LPIs).
	 * Kernel IRQs 208..255 (see gic_lpi.h) are reserved for them
	 * and the endpoint doorbell is GITS_TRANSLATER at
	 * ITS + 0x10040 = 0xFD450040. The LPI property/pending tables
	 * live in cached normal memory with write-back attributes,
	 * kept coherent by the driver's explicit flush/inval, like
	 * the reference bare-metal setup. */
	@Runlevel(2) include embox.driver.interrupt.gicv3_its(its_base=0xFD440000, gicd_base=0xFD400000, gicr_base=0xFD460000)

	/* PCIe: both root complex links are trained by the U-Boot preboot
	 * (`pci enum`); the kernel only inherits the firmware state.
	 * Flat bus layout: 0/1 = pcie2x1 (M.2 NVMe), 2/3 = pcie3x2
	 * (slot, e.g. Intel 7260 -- identify only). The endpoint BARs
	 * were assigned by the firmware inside the 30M memory windows.
	 * doorbell_base routes the endpoints' MSI/MSI-X writes inbound to
	 * the ITS GITS_TRANSLATER window (0xFD450000). */
	include embox.driver.pci(bus_n_to_scan=4, dev_quantity=16)
	include embox.driver.pci_chip.pcie_dw(doorbell_base=0xFD450000, doorbell_size=0x1000)
	/* Message interrupts for the endpoints ride the ITS LPIs
	 * above; the framework programs the endpoint capabilities. */
	include embox.driver.pci_msi
	@Runlevel(3) include embox.driver.nvme(msi_mode=true)

	/* SATA: the two on-chip DWC AHCI controllers, one port each (the
	 * vertical socket on sata0, the M.2 2280 slot on sata1). Their
	 * combo PHYs and links are brought up by the U-Boot preboot
	 * (`scsi scan`), so the driver only takes over the command engines
	 * of the trained links and never reprograms the PHY. */
	@Runlevel(3) include embox.driver.ahci.dwc_ahci

	/* Network: the stock Embox stack over both GMAC ports. gmac0
	 * @0xFE2A0000 enumerates as eth0 (MAC 02:e4:a5:35:68:00, the
	 * U-Boot ethaddr contract, IRQ 59 = SPI 27 + 32) and gmac1
	 * @0xFE010000 as eth1 (02:e4:a5:35:68:01 = U-Boot eth1addr,
	 * IRQ 64 = SPI 32 + 32); the ethN indexes thus match U-Boot's
	 * device naming. */
	@Runlevel(2) include embox.driver.net.loopback
	@Runlevel(2) include embox.net.core
	@Runlevel(2) include embox.net.skbuff(amount_skb=128)
	@Runlevel(2) include embox.net.skbuff_data(
				amount_skb_data=128, data_size=1514,
				data_align=1, data_padto=1, ip_align=false)
	@Runlevel(2) include embox.net.skbuff_extra(
				amount_skb_extra=128, extra_size=10,
				extra_align=1, extra_padto=1)
	@Runlevel(2) include embox.net.socket
	@Runlevel(2) include embox.net.dev
	@Runlevel(2) include embox.net.net_entry
	@Runlevel(2) include embox.net.af_inet
	@Runlevel(2) include embox.net.ipv4
	@Runlevel(2) include embox.net.arp
	@Runlevel(2) include embox.net.rarp
	@Runlevel(2) include embox.net.icmpv4
	@Runlevel(2) include embox.net.udp
	@Runlevel(2) include embox.net.udp_sock
	@Runlevel(2) include embox.net.raw_sock
	@Runlevel(2) include embox.driver.net.rk3568_gmac

	include embox.cmd.net.ping
	include embox.cmd.net.ifconfig
	include embox.cmd.net.route
	include embox.cmd.net.arp

	/* UART2 (DW-APB 16550) at 0xFE660000, 24 MHz baud clock, IRQ 150 --
	 * the console the vendor U-Boot already leaves running at 115200.
	 * reg_width=4 + mem32_access matches the DW-APB layout the Linux DTS
	 * describes as reg-shift=2, reg-io-width=4. */
	include embox.driver.serial.ns16550(mem32_access=true, reg_width=4, clk_freq=24000000)
	include embox.driver.serial.ns16550_diag(base_addr=0xFE660000, baud_rate=115200)
	include embox.driver.serial.ns16550_ttyS0(base_addr=0xFE660000, irq_num=150, baud_rate=115200)
	include embox.driver.diag(impl="embox__driver__serial__ns16550_diag")

	/* EL1 physical timer (CNTFRQ=24 MHz left by firmware), PPI 13 -> INTID 30 */
	@Runlevel(0) include embox.driver.clock.armv8_phy_timer(irq_num=30)
	include embox.kernel.time.jiffies(cs_name="armv8_phy_timer")

	@Runlevel(0) include embox.mem.phymem
	@Runlevel(1) include embox.kernel.timer.sys_timer
	@Runlevel(1) include embox.kernel.time.kernel_time

	@Runlevel(2) include embox.kernel.irq
	@Runlevel(2) include embox.kernel.critical
	@Runlevel(2) include embox.kernel.timer.sleep
	@Runlevel(2) include embox.kernel.timer.strategy.head_timer
	@Runlevel(2) include embox.kernel.time.kernel_time
	@Runlevel(2) include embox.kernel.task.multi
	@Runlevel(2) include embox.kernel.thread.core(thread_stack_size=0x20000, thread_stack_align=16)
	include embox.kernel.sched.strategy.priority_based
	include embox.kernel.thread.signal.sigstate
	include embox.kernel.thread.signal.siginfoq
	include embox.kernel.task.resource.env(env_str_len=64)

	include embox.mem.pool_adapter
	@Runlevel(2) include embox.mem.static_heap(heap_size=0x4000000)
	include embox.mem.heap_bm(heap_size=0x2000000)
	include embox.mem.bitmask(page_size=65536)

	@Runlevel(2) include embox.fs.node(fnode_quantity=1024)
	@Runlevel(2) include embox.fs.rootfs_oldfs
	@Runlevel(2) include embox.fs.driver.initfs
	@Runlevel(2) include embox.fs.driver.ramfs
	include embox.fs.driver.devfs_old
	include embox.compat.posix.file_system_oldfs

	@Runlevel(2) include embox.cmd.sh.tish(
				prompt="%u@%h:%w%$", rich_prompt_support=1,
				builtin_commands="exit logout cd export mount umount")
	include embox.init.system_start_service(log_level="LOG_INFO", tty_dev="ttyS0")

	include embox.cmd.help
	include embox.cmd.man

	include embox.cmd.sys.uname
	include embox.cmd.sys.export
	include embox.cmd.sys.version
	include embox.cmd.sys.date
	include embox.cmd.sys.time
	include embox.cmd.sys.shutdown

	include embox.cmd.lsmod
	include embox.cmd.test

	include embox.cmd.proc.thread
	include embox.cmd.proc.top

	include embox.cmd.hw.mmutrans
	include embox.cmd.hw.mem

	include embox.cmd.wc
	include embox.cmd.fs.head
	include embox.cmd.fs.cat
	include embox.cmd.fs.cd
	include embox.cmd.fs.pwd
	include embox.cmd.fs.ls
	include embox.cmd.fs.echo

	include embox.cmd.testing.ticker
	include embox.cmd.testing.its_test
	/* Destructive write/read-back verification of block devices */
	include embox.cmd.testing.block_dev_test

	/* PCI and block device visibility commands */
	include embox.cmd.lspci
	include embox.cmd.hw.lsblk
	include embox.cmd.blockdev
	include embox.cmd.fs.blkdump

	/* net80211 wireless (third-party/net80211, cherryusb host on the
	 * panel EHCI) and the wpa_supplicant port (third-party/wpa_supplicant). */
	include third_party.net80211.cherryusb_host
	include third_party.net80211.net80211_port_cherryusb
	/* Intel 7260 in the PCIe slot (pcie3x2 link trained by U-Boot). */
	include third_party.net80211.net80211_pcie_bus_embox
	include third_party.net80211.net80211_port_pcie_embox
	include third_party.net80211.net80211_wlan_cmd
	include third_party.wpa_supplicant.wpa_supplicant_core
	include third_party.wpa_supplicant.wpa_supplicant_net80211
	include third_party.wpa_supplicant.wpa_supplicant_embox
	include third_party.wpa_supplicant.wpa_cmd

	/* Stock network stack over the wireless interface: L2 in net.core,
	 * L3 for the data path (ping/dhcp once associated). */
	@Runlevel(2) include embox.net.core
	@Runlevel(2) include embox.net.skbuff(amount_skb=128)
	@Runlevel(2) include embox.net.skbuff_data(amount_skb_data=128, data_size=1514, data_align=1, data_padto=1, ip_align=false)
	@Runlevel(2) include embox.net.skbuff_extra(amount_skb_extra=128, extra_size=10, extra_align=1, extra_padto=1)
	@Runlevel(2) include embox.net.socket
	@Runlevel(2) include embox.net.dev
	@Runlevel(2) include embox.net.net_entry
	@Runlevel(2) include embox.net.af_inet
	@Runlevel(2) include embox.net.ipv4
	@Runlevel(2) include embox.net.arp
	@Runlevel(2) include embox.net.rarp
	@Runlevel(2) include embox.net.icmpv4
	@Runlevel(2) include embox.net.udp
	@Runlevel(2) include embox.net.udp_sock
	@Runlevel(2) include embox.net.raw_sock
	include embox.net.wifi.cfg80211

	include embox.cmd.net.ping
	include embox.cmd.net.ifconfig
	include embox.cmd.net.route
	include embox.cmd.net.arp
	include embox.cmd.net.iwlist

	include embox.compat.libc.all
	include embox.compat.libc.stdio.asprintf
	include embox.compat.libc.math_simple
	include embox.compat.posix.pthread_key
	include embox.compat.posix.proc.atexit_stub

	include embox.compat.atomic.pseudo_atomic

	include embox.lib.libds
	include embox.framework.LibFramework
}
