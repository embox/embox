/*
 * Linkage configuration for the Rockchip RK3568 (E4AP5G1-ITX board).
 *
 * The image is loaded with U-Boot `tftp 0x0a000000` + `go 0x0a000000`,
 * the load address proven by the bare-metal lane on this board. Keep the
 * region clear of the firmware/ATF/OP-TEE reservations below 0x0a000000.
 */

/* region (origin, length) */
RAM (0x0a000000, 256M)

/* section (region[, lma_region]) */
text   (RAM)
rodata (RAM)
data   (RAM)
bss    (RAM)
