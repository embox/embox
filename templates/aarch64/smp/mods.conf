package genconfig

configuration conf {
	include embox.arch.system(core_freq=800000000)
	include embox.arch.aarch64.cpu_idle
	include embox.arch.aarch64.locore
	include embox.arch.aarch64.interrupt
	include embox.arch.aarch64.context
	include embox.arch.aarch64.mem_barriers
	include embox.arch.aarch64.libarch
	include embox.arch.aarch64.vfork

	/* cpu_count is NCPU, and auto_qemu reads it back to size -smp */
	include embox.arch.aarch64.cpu(cpu_count=4)

	/* auto_qemu starts an aarch64 image as -M virt,gic_version=3, and these
	 * are where that machine puts the frames */
	include embox.driver.interrupt.gicv3(gicd_base=0x8000000, gicr_base=0x80a0000)

	include embox.driver.serial.pl011
	include embox.driver.serial.pl011_diag(base_addr=0x09000000)
	include embox.driver.serial.pl011_ttyS0(base_addr=0x09000000, irq_num=33)
	include embox.driver.diag(impl="embox__driver__serial__pl011_diag")

	@Runlevel(0) include embox.driver.clock.armv8_phy_timer(irq_num=30)
	include embox.kernel.time.jiffies(cs_name="armv8_phy_timer")

	@Runlevel(0) include embox.arch.aarch64.mmu(granule=4)
	@Runlevel(0) include embox.kernel.task.kernel_task
	/* ap_stack_size is one stack per secondary, and holds its idle thread */
	@Runlevel(0) include embox.kernel.stack(stack_size=0x20000, ap_stack_size=0x20000)
	@Runlevel(0) include embox.mem.phymem

	@Runlevel(1) include embox.kernel.sched.sched(log_level="LOG_NONE")
	@Runlevel(1) include embox.kernel.timer.sys_timer
	@Runlevel(1) include embox.kernel.time.kernel_time

	@Runlevel(2) include embox.kernel.irq
	@Runlevel(2) include embox.kernel.critical
	@Runlevel(2) include embox.kernel.timer.sleep
	/* One timer list per core, which the plain head_timer does not have */
	@Runlevel(2) include embox.kernel.timer.strategy.head_timer_smp
	@Runlevel(2) include embox.kernel.task.multi
	@Runlevel(2) include embox.kernel.thread.core(log_level="LOG_NONE")

	/* The idle thread, not the idle lthread: under SMP a wakeup is delivered
	 * only to a schedee that is not `active`, and only a real context switch
	 * clears that. It is also what calls cpu_init(), which cpu_get_idle()
	 * answers with. */
	include embox.kernel.sched.idle_thread
	include embox.kernel.lthread.lthread
	include embox.kernel.spinlock(spin_debug=false)
	/* The one run queue that filters by affinity, which sched.c needs as
	 * soon as SMP is defined */
	include embox.kernel.sched.strategy.priority_based_smp
	include embox.kernel.thread.signal.sigstate
	include embox.kernel.thread.signal.siginfoq
	include embox.kernel.task.resource.env(env_str_len=64)

	include embox.mem.pool_adapter
	@Runlevel(2) include embox.mem.static_heap(heap_size=0x2000000)
	@Runlevel(2) include embox.mem.heap_bm(heap_size=0x1000000)
	@Runlevel(2) include embox.mem.bitmask(page_size=4096)

	@Runlevel(2) include embox.fs.node(fnode_quantity=1024)
	@Runlevel(2) include embox.fs.rootfs_oldfs
	@Runlevel(2) include embox.fs.driver.initfs
	@Runlevel(2) include embox.fs.driver.ramfs
	include embox.fs.driver.devfs_old
	include embox.compat.posix.file_system_oldfs
	include embox.driver.block_dev

	include embox.compat.libc.all
	include embox.compat.libc.stdio.asprintf
	include embox.compat.libc.math_simple
	include embox.compat.posix.pthread_key
	include embox.compat.posix.proc.atexit_stub
	include embox.compat.atomic.pseudo_atomic

	include embox.lib.libds
	include embox.framework.LibFramework

	/**
	* SMP module init before test module for accuracy
	* And after unit initializing to prevent bootstrap
	* thread be scheduled to APs
	*/
	/* The plain -M virt that auto_qemu uses boots the image at EL1 and puts
	 * PSCI behind HVC; virt,virtualization=on boots at EL2 and wants smc */
	@Runlevel(3) include embox.arch.aarch64.smp(psci_method="hvc")
	@Runlevel(3) include embox.kernel.cpu.smp

	@Runlevel(3) include embox.test.smp.test_smp
	@Runlevel(3) include embox.test.smp.simult_thread_test(log_level="LOG_DEBUG")
	@Runlevel(3) include embox.test.smp.smp_threads
	@Runlevel(3) include embox.test.kernel.sleep_smp
	@Runlevel(3) include embox.test.kernel.thread.join_smp
	@Runlevel(3) include embox.test.kernel.thread.mutex_pair
	@Runlevel(3) include embox.test.kernel.sched.runq_smp
	@Runlevel(3) include embox.test.mem.heap_threads_test

	@Runlevel(3) include embox.cmd.sh.tish(
				prompt="%u@%h:%w%$", rich_prompt_support=1,
				builtin_commands="exit logout cd export mount umount")
	@Runlevel(3) include embox.init.system_start_service(log_level="LOG_INFO", tty_dev="ttyS0")
	include embox.cmd.service

	include embox.cmd.fs.cat
	include embox.cmd.fs.echo
	include embox.cmd.fs.ls
	include embox.cmd.fs.pwd

	include embox.cmd.help
	include embox.cmd.lsmod
	include embox.cmd.test

	include embox.cmd.proc.thread
	include embox.cmd.proc.top
	include embox.cmd.mpstat

	include embox.cmd.sys.uname
	include embox.cmd.sys.version
	include embox.cmd.sys.export
	include embox.cmd.sys.shutdown

	include embox.cmd.testing.ticker
	include embox.cmd.hw.mem
}
